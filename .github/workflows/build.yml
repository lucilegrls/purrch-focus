name: Build and test Purrch
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: purrch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm test && npm run lint && npm run build
      - run: npx cap sync android
      - name: Restore private signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/purrch.p12"
          chmod 600 "$RUNNER_TEMP/purrch.p12"
      - name: Build signed Android app and run policy tests
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/purrch.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:testDebugUnitTest :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Prepare installable APK
        run: cp android/app/build/outputs/apk/release/app-release.apk purrch.apk
      - uses: actions/upload-artifact@v4
        with:
          name: purrch-android
          path: purrch.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-test-packages
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Remove runner signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/purrch.p12"
  android-device-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-test-packages
          path: apks
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install apks/debug/app-debug.apk
            adb install apks/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class app.purrch.focus.FocusGuardInstrumentedTest app.purrch.focus.test/androidx.test.runner.AndroidJUnitRunner > instrumentation.txt
            cat instrumentation.txt
            adb pull /sdcard/Android/data/app.purrch.focus/files/. android-screenshots || true
            grep -q 'OK (1 test)' instrumentation.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-test-result
          path: |
            instrumentation.txt
            android-screenshots/
  publish-preview:
    needs: [build, android-device-test]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy browser preview
        id: deployment
        uses: actions/deploy-pages@v4
